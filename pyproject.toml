[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "connectivity-support-agent"
version = "0.1.0"
description = "Educational simulated connectivity service-status lookup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["streamlit==1.67.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
